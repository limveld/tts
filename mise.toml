[tools]
go = "latest"
python = "3.12"

[tasks.setup]
description = "Create the Python venv and install the Kokoro sidecar deps"
run = [
  "python -m venv .venv",
  "./.venv/bin/pip install -U pip",
  "./.venv/bin/pip install -r pysidecar/requirements.txt",
]

[tasks.reload]
description = "Apply edits: rebuild binaries (if changed), fetch sfx clips, restart both services"
depends = ["server:build", "bot:build"]
run = '''
mise run sfx:fetch
mise run server:service:restart
mise run bot:service:restart
'''

# ---- server ----------------------------------------------------------------

[tasks."server:build"]
description = "Build the TTS server binary"
sources = ["server/*.go", "sfxlib/*.go", "go.mod"] # see bot:build — sources must cover every dep
outputs = ["bin/tts-server"]
run = "go build -o bin/tts-server ./server"

[tasks."server:serve"]
description = "Run the TTS server in the foreground (dev); voices/engines come from voices.toml"
depends = ["server:build"]
run = "./bin/tts-server"

[tasks."server:service:install"]
description = "Install & start the TTS server launchd service (auto-start at login)"
depends = ["server:build"]
run = "bash deploy/service.sh server install"

[tasks."server:service:uninstall"]
description = "Stop & remove the TTS server service"
run = "bash deploy/service.sh server uninstall"

[tasks."server:service:start"]
description = "Start (load) the TTS server service"
run = "bash deploy/service.sh server start"

[tasks."server:service:stop"]
description = "Stop (unload) the TTS server service"
run = "bash deploy/service.sh server stop"

[tasks."server:service:restart"]
description = "Restart the TTS server service"
run = "bash deploy/service.sh server restart"

[tasks."server:service:status"]
description = "Show the TTS server service state and hit /healthz"
run = "bash deploy/service.sh server status"

[tasks."server:service:logs"]
description = "Follow the TTS server error log"
run = "bash deploy/service.sh server logs"

# ---- sfx --------------------------------------------------------------------

[tasks."sfx:fetch"]
description = "Download soundboard clips declared in sfx.toml into sfx/ (idempotent)"
run = "go run ./cmd/sfx-fetch"

# ---- connections ------------------------------------------------------------

[tasks."connections:sync"]
description = "Download the latest NYT Connections puzzle corpus to connections.json (restart the bot to apply)"
run = "go run ./cmd/connections-fetch"

# ---- bot -------------------------------------------------------------------

[tasks."bot:build"]
description = "Build the Twitch bot binary"
# Every package `go list -deps ./bot` reports, not just bot/ — a twitch/ or store/
# change that isn't listed here leaves the fingerprint unchanged, so the task
# no-ops and bot:service:restart relaunches the stale binary.
sources = ["bot/*.go", "twitch/*.go", "store/**/*.go", "sfxlib/*.go", "go.mod"]
outputs = ["bin/tts-bot"]
run = "go build -o bin/tts-bot ./bot"

[tasks."bot:test"]
description = "Run the bot test suite"
run = "go test ./bot/..."

[tasks."bot:serve"]
description = "Run the bot in the foreground (set TTS_CHANNEL=<your_channel>)"
depends = ["bot:build"]
run = './bin/tts-bot -channel "${TTS_CHANNEL:?set TTS_CHANNEL to your twitch channel}"'

[tasks."bot:auth"]
description = "One-time Twitch OAuth consent so the bot can reply (set TWITCH_CLIENT_ID/SECRET)"
run = '''
: "${TWITCH_CLIENT_ID:?set TWITCH_CLIENT_ID to your Twitch app id}"
: "${TWITCH_CLIENT_SECRET:?set TWITCH_CLIENT_SECRET to your Twitch app secret}"
go run ./cmd/bot-auth
'''

[tasks."bot:service:install"]
description = "Install & start the bot launchd service (set TTS_CHANNEL first)"
depends = ["bot:build"]
run = "bash deploy/service.sh bot install"

[tasks."bot:service:uninstall"]
description = "Stop & remove the bot service"
run = "bash deploy/service.sh bot uninstall"

[tasks."bot:service:start"]
description = "Start (load) the bot service"
run = "bash deploy/service.sh bot start"

[tasks."bot:service:stop"]
description = "Stop (unload) the bot service"
run = "bash deploy/service.sh bot stop"

[tasks."bot:service:restart"]
description = "Restart the bot service"
run = "bash deploy/service.sh bot restart"

[tasks."bot:service:status"]
description = "Show the bot service state"
run = "bash deploy/service.sh bot status"

[tasks."bot:service:logs"]
description = "Follow the bot error log"
run = "bash deploy/service.sh bot logs"

# ---- tests -------------------------------------------------------------------

[tasks.test]
description = "Run the whole suite (Postgres cases skip if the DB isn't up — the banner says so)"
run = '''
if [ -n "${TEST_DATABASE_URL:-}" ] && pg_isready -q 2>/dev/null; then
  echo "── postgres: $TEST_DATABASE_URL — backend conformance WILL run"
else
  echo "── postgres: not configured — backend conformance will be SKIPPED"
  echo "   (t.Skip is invisible without -v, so this line is the only warning you get)"
  echo "   set it up with: mise run db:test:setup"
fi
go vet ./... && go test ./...
'''

[tasks."test:all"]
description = "Run the whole suite and FAIL if Postgres isn't reachable"
run = '''
: "${TEST_DATABASE_URL:=postgres:///tts_test}"
export TEST_DATABASE_URL TTS_REQUIRE_POSTGRES=1
echo "── postgres required: $TEST_DATABASE_URL"
go vet ./... && go test ./...
'''

[tasks."store:test"]
description = "Run the store suites (both backends)"
run = "go test ./store/... ./cmd/store-migrate/..."

# ---- database ----------------------------------------------------------------
#
# Phase 1 is a local Homebrew Postgres on this Mac. There is deliberately no
# launchd ordering between it and the bot: brew installs its own login agent and
# the bot may win the race at boot. The bot fails fast, launchd throttles the
# respawn, and it comes up once Postgres is listening. See docs/postgres.md.

[tasks."db:install"]
description = "Install & start Postgres 18 via Homebrew"
run = '''
brew install postgresql@18
brew services start postgresql@18
'''

[tasks."db:start"]
description = "Start the Postgres service"
run = "brew services start postgresql@18"

[tasks."db:stop"]
description = "Stop the Postgres service"
run = "brew services stop postgresql@18"

[tasks."db:status"]
description = "Show the Postgres service state and whether it's accepting connections"
run = '''
brew services list | grep postgresql || echo "  postgresql not installed via brew"
pg_isready || true
'''

[tasks."db:create"]
description = "Create the tts database (idempotent)"
run = 'createdb tts 2>/dev/null && echo "created database tts" || echo "database tts already exists"'

[tasks."db:test:setup"]
description = "Create the tts_test database and print the export line for TEST_DATABASE_URL"
run = '''
createdb tts_test 2>/dev/null && echo "created database tts_test" || echo "database tts_test already exists"
echo
echo "Add this to mise.local.toml so the conformance suite runs:"
echo
echo "  [env]"
echo '  TEST_DATABASE_URL = "postgres:///tts_test"'
'''

[tasks."db:build"]
description = "Build the store-migrate tool"
sources = ["cmd/store-migrate/*.go", "store/**/*.go", "go.mod"]
outputs = ["bin/store-migrate"]
run = "go build -o bin/store-migrate ./cmd/store-migrate"

[tasks."db:migrate"]
description = "Create/upgrade the schema on $TTS_DATABASE_URL without copying anything"
depends = ["db:build"]
run = './bin/store-migrate -migrate-only -to "${TTS_DATABASE_URL:?set TTS_DATABASE_URL to the postgres:// DSN}"'

[tasks."db:cutover"]
description = "Copy bot.db into $TTS_DATABASE_URL and verify (bot must be STOPPED)"
depends = ["db:build"]
run = './bin/store-migrate -from bot.db -to "${TTS_DATABASE_URL:?set TTS_DATABASE_URL to the postgres:// DSN}"'

[tasks."db:verify"]
description = "Compare bot.db against $TTS_DATABASE_URL without copying"
depends = ["db:build"]
run = './bin/store-migrate -from bot.db -to "${TTS_DATABASE_URL:?set TTS_DATABASE_URL to the postgres:// DSN}" -verify-only'

[tasks."db:rollback"]
description = "Copy $TTS_DATABASE_URL back into bot.db (bot must be STOPPED), then unset TTS_DATABASE_URL"
depends = ["db:build"]
run = './bin/store-migrate -from "${TTS_DATABASE_URL:?set TTS_DATABASE_URL to the postgres:// DSN}" -to bot.db -force'

[tasks."db:psql"]
description = "Open psql against $TTS_DATABASE_URL"
run = 'psql "${TTS_DATABASE_URL:?set TTS_DATABASE_URL to the postgres:// DSN}"'

[tasks."db:backup"]
description = "Take a pg_dump backup now (same script the daily agent runs)"
run = "bash deploy/pg-backup.sh"

[tasks."db:backup:install"]
description = "Install the daily 05:00 pg_dump LaunchAgent"
run = "bash deploy/service.sh pgbackup install"

[tasks."db:backup:uninstall"]
description = "Remove the daily backup agent"
run = "bash deploy/service.sh pgbackup uninstall"

[tasks."db:partition:build"]
description = "Build the ledger partition-maintenance binary"
run = "go build -o bin/pg-partition ./cmd/pg-partition"

[tasks."db:partition"]
description = "Run one partition-maintenance pass now (provision, fold, reconcile, drop)"
run = "go run ./cmd/pg-partition"

[tasks."db:partition:dry"]
description = "Show what a partition-maintenance pass would do, changing nothing"
run = "go run ./cmd/pg-partition -dry-run"

[tasks."db:partition:backfill"]
description = "Rescue rows stranded in ledger_default (after a re-cutover, or a long agent outage)"
run = "go run ./cmd/pg-partition -backfill"

[tasks."db:partition:install"]
description = "Install the daily 05:15 partition-maintenance LaunchAgent (runs after the backup)"
depends = ["db:partition:build"]
run = "bash deploy/service.sh pgpartition install"

[tasks."db:partition:uninstall"]
description = "Remove the partition-maintenance agent"
run = "bash deploy/service.sh pgpartition uninstall"

[tasks."db:partition:status"]
description = "Show the partition-maintenance agent's state"
run = "bash deploy/service.sh pgpartition status"

[tasks."db:partition:logs"]
description = "Follow the partition-maintenance agent's error log"
run = "bash deploy/service.sh pgpartition logs"
