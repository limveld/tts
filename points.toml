# Marks economy: viewers earn "marks" and spend them on !tts / !sfx.
#
# Marks are earned two ways:
#   1. Watch-time accrual — every `accrual_interval` while the stream is LIVE,
#      each present viewer is credited `accrual_rate` marks.
#   2. Channel-Point conversion — the bot creates a custom channel-point reward
#      (`reward_title`, costing `reward_cost` points) that grants `reward_grant`
#      marks each time it's redeemed.
#
# Marks are spent by using !tts (`tts_cost`) and !sfx (`sfx_cost`); everyone pays
# (mods and broadcaster included). Check a balance with !marks / !m; see the top
# holders with !leaderboard.
#
# Owner controls (broadcaster only, no config needed): !grant @user <amount>
# mints marks to anyone (negative removes, floored at 0); !free / !paid toggle
# whether !tts/!sfx charge at all (persisted across restarts). Free mode only
# waives tts/sfx cost — accrual and !gamble/!give keep using real marks.
#
# This file being present ENABLES the economy. It also requires authorizing as
# the broadcaster with the marks scopes — run `mise run bot:auth` (re-consent
# after adding the scopes). Without that, tts/sfx stay free.
#
# After editing: `mise run reload`.

currency_name = "marks"

# Watch-time accrual (live only).
accrual_interval = "1m"   # Go duration: 30s, 1m, 5m
accrual_rate     = 1      # marks per interval per present viewer

# Spend costs.
tts_cost = 10
sfx_cost = 10

# Channel-Point → marks conversion reward (the bot creates/manages it).
reward_title  = "Convert to Marks"
reward_cost   = 100                       # channel points per redemption
reward_grant  = 100                        # marks granted per redemption
reward_prompt = "Convert channel points into marks for !tts and !sfx."
poll_interval = "30s"                      # how often to check for redemptions

# Games. !g opens a multiplayer pot gamble: someone types !g <amount> (the
# buy-in), others join by typing !g for `gamble_duration`, then one winner is
# drawn and takes the whole pot (needs 2+ players or it refunds). !give transfers.
gamble_min_bet  = 10       # minimum buy-in to open a gamble
gamble_duration = "60s"    # how long an open round accepts joins

# Wordle: anyone starts a shared 6-row board with !wordle, then everyone guesses
# with !guess <word> (unlimited guesses per user). Solving it awards the solver
# `wordle_reward` marks and a win on the !wordlewins leaderboard. A round auto-ends
# after `wordle_duration` if unsolved (the word is revealed).
wordle_reward   = 100      # marks awarded to a Wordle solver
wordle_duration = "3m"     # how long a round runs before it auto-ends

# Connections: anyone starts a 4x4 board with !connections (or !conn), then chat
# submits groups of four by tile number, e.g. !group 1 5 9 12 (first valid group
# wins it). Each correct group pays its solver `connections_group_reward` × the
# group's difficulty (yellow ×1 … purple ×4); whoever lands the final 4th group
# also gets `connections_solve_bonus` and a win on the !connectionswins
# leaderboard. Four shared mistakes or `connections_duration` elapsing ends the
# round (remaining groups are revealed). Mods: !skipgame, !reveal, !shuffle.
# Torch Maze: up to five chatters race a fogged maze for keys that are one short
# of the field (!maze to open a round, !up !down !left !right to play). The winner takes
# `maze_reward`; every later place takes half of the one above it, floored at 1,
# so finishing at all is worth more than not finishing — which is the whole reason
# the scramble for second and third after the winner exists. Only the winner is
# tallied on !mazewins. Round pacing lives in maze.toml, not here.
maze_reward = 100   # marks to the winner; 2nd gets 50, 3rd 25, 4th 12...

connections_group_reward = 25   # base marks per solved group (scaled ×(level+1))
connections_solve_bonus  = 100  # extra marks to whoever completes the puzzle
connections_duration     = "10m" # how long a round runs before it auto-ends
